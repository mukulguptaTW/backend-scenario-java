name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read          # minimum needed to checkout the repo
  checks: write           # allows test-reporter to post results
  pull-requests: write    # allows test-reporter to post PR comments
  security-events: write  # allows Snyk to upload SARIF to GitHub Code Scanning

# ── Workflow-level variables ────────────────────────────────────────────────
# Non-sensitive configuration values shared across jobs.
# SONAR_HOST_URL    — change to your self-hosted URL if not using SonarCloud.
# SONAR_ORGANIZATION — your SonarCloud organization key (GitHub username/org).
#                      Find it at: https://sonarcloud.io/account/organizations
env:
  SONAR_HOST_URL: https://sonarcloud.io
  SONAR_ORGANIZATION: mukulguptatws

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build & Test
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 21 (matches spring-boot-starter-parent 4.1.0) ──────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'        # Eclipse Temurin — free, reputable build
          cache: 'maven'                 # caches ~/.m2 between runs

      # ── 3. Validate Maven wrapper checksum (supply-chain safety) ───────────
      - name: Validate Maven wrapper
        run: ./mvnw --version --no-transfer-progress

      # ── 4. Build, run tests, enforce coverage thresholds ──────────────────
      #       -B            = batch/non-interactive mode (no colour codes)
      #       verify        = compile + test + jacoco:check + jacoco:report
      #       --no-transfer-progress = cleaner CI logs
      - name: Build and verify
        run: ./mvnw -B verify --no-transfer-progress

      # ── 5. Publish JaCoCo XML coverage report as a workflow summary ────────
      - name: Upload JaCoCo XML report
        if: always()                    # upload even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          retention-days: 14

      # ── 6. Upload the packaged JAR so it can be downloaded from the run ───
      - name: Upload application JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: petclinic-rest-jar
          path: target/*.jar
          retention-days: 7

      # ── 7. Publish Surefire (JUnit) test results in the Actions UI ─────────
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false          # don't fail the step; the build step already handles this

      # ── 8. Cache the full Maven local repository for security jobs ─────────
      #       Both sonarqube and snyk jobs need compiled classes; sharing the
      #       ~/.m2 cache avoids a full re-download on every parallel runner.
      - name: Cache Maven local repository for downstream jobs
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      # ── 9. Share compiled target/ dir with downstream security jobs ────────
      - name: Upload build target for security scans
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-target
          # Include compiled classes, generated sources, and JaCoCo XML so
          # SonarQube can read coverage data without re-running tests.
          path: |
            target/classes
            target/generated-sources
            target/site/jacoco/jacoco.xml
            pom.xml
          retention-days: 1             # short-lived — only needed within the run

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — SonarQube analysis  (runs in PARALLEL with snyk after build)
  # Required secrets (GitHub → Settings → Secrets → Actions):
  #   SONAR_TOKEN  — project analysis token from https://sonarcloud.io/account/security
  # ────────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build                        # wait for build to succeed first

    steps:
      # ── 1. Checkout (SonarQube scanner needs full SCM history for blame) ───
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                # full history required for blame/new-code detection

      # ── 2. Set up Java 21 ─────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # ── 3. Restore the Maven local repository saved by the build job ───────
      - name: Restore Maven local repository cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # ── 4. Download compiled classes + JaCoCo report from build job ─────────
      - name: Download build target artifact
        uses: actions/download-artifact@v4
        with:
          name: build-target
          # Restore into the same relative paths the Maven build would produce
          path: .

      # ── 5. Run SonarQube scanner via the Maven plugin ──────────────────────
      #       sonar:sonar is a lightweight goal — it does NOT recompile or
      #       rerun tests; it reads already-generated .class files and the
      #       JaCoCo XML coverage report produced by the build job.
      #
      #       SONAR_TOKEN        → GitHub secret (sensitive, never logged).
      #       SONAR_HOST_URL     → workflow-level env var (top of this file).
      #       SONAR_ORGANIZATION → workflow-level env var (top of this file);
      #                            must match your SonarCloud organization key.
      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            --no-transfer-progress \
            -Dsonar.projectKey=spring-petclinic-rest \
            -Dsonar.projectName="Spring PetClinic REST" \
            -Dsonar.organization="${{ env.SONAR_ORGANIZATION }}" \
            -Dsonar.host.url="${{ env.SONAR_HOST_URL }}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.exclusions="**/rest/dto/**,**/rest/api/**" \
            -Dsonar.scm.provider=git

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Snyk security scan  (runs in PARALLEL with sonarqube after build)
  # Required secrets:
  #   SNYK_TOKEN — API token from https://app.snyk.io/account (User Settings)
  # ────────────────────────────────────────────────────────────────────────────
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: build                        # wait for build to succeed first
    # ── Job-level env: SNYK_TOKEN is read natively by the Snyk CLI ───────────
    # This is the correct CI authentication pattern — no `snyk auth` command
    # needed. The CLI detects SNYK_TOKEN automatically on every step,
    # so the token is never logged or passed as a CLI argument.
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 21 ─────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # ── 3. Set up Node.js for Snyk CLI ────────────────────────────────────
      #       Snyk CLI is distributed via npm; pin the Node LTS major version.
      - name: Set up Node.js (for Snyk CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'            # LTS; pinned major to avoid surprise upgrades

      # ── 4. Install Snyk CLI at a pinned version (supply-chain safety) ──────
      - name: Install Snyk CLI
        run: npm install --global snyk@1.1295.1

      # ── 5. Restore the Maven local repository saved by the build job ───────
      - name: Restore Maven local repository cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # ── 6. Run Snyk open-source (dependency) vulnerability scan ────────────
      #       SNYK_TOKEN is picked up automatically from the job-level env block.
      #       --all-projects  scans every Maven module in the repo
      #       --severity-threshold=high  only fail on High/Critical findings
      #       continue-on-error lets the SARIF upload step always run
      - name: Snyk dependency vulnerability test
        run: |
          snyk test \
            --all-projects \
            --severity-threshold=high \
            --json-file-output=snyk-results.json
        continue-on-error: true         # capture SARIF even when vulnerabilities are found

      # ── 7. Convert Snyk JSON results to SARIF format ───────────────────────
      - name: Convert Snyk results to SARIF
        if: always()
        run: |
          snyk test \
            --all-projects \
            --severity-threshold=high \
            --sarif-file-output=snyk.sarif || true

      # ── 9. Upload SARIF report to GitHub Code Scanning ─────────────────────
      #       Findings appear in Security → Code scanning alerts on the repo.
      #       Runs even when snyk test exits non-zero (vulnerabilities found).
      - name: Upload Snyk SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
          category: snyk-oss           # groups results under a named tool category

      # ── 10. Upload raw Snyk JSON report as a workflow artifact ─────────────
      - name: Upload Snyk JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: snyk-results.json
          retention-days: 14

      # ── 11. Publish Snyk Security Summary to GitHub Job Summary ────────────
      #        Writes a rich Markdown report to the Actions "Summary" tab.
      #        Handles missing/malformed JSON gracefully — never exposes secrets.
      - name: Publish Snyk Security Summary
        if: always()
        run: |
          RESULTS_FILE="snyk-results.json"
          SUMMARY_FILE="${GITHUB_STEP_SUMMARY}"

          # ── Helper: write a line to the summary ─────────────────────────────
          summary() { printf '%s\n' "$*" >> "${SUMMARY_FILE}"; }

          summary "## 🔐 Snyk Security Scan Results"
          summary ""
          summary "| Detail        | Value |"
          summary "|---------------|-------|"
          summary "| **Branch**    | \`${{ github.ref_name }}\` |"
          summary "| **Commit**    | \`${{ github.sha }}\` |"
          summary "| **Triggered** | ${{ github.event_name }} |"
          summary "| **Snyk CLI**  | $(snyk --version 2>/dev/null || echo 'unknown') |"
          summary ""

          # ── Guard: check the results file exists and is valid JSON ───────────
          if [ ! -f "${RESULTS_FILE}" ]; then
            summary "> ⚠️ **\`snyk-results.json\` was not found.** The scan may have failed before producing output."
            exit 0
          fi

          if ! jq empty "${RESULTS_FILE}" 2>/dev/null; then
            summary "> ⚠️ **\`snyk-results.json\` contains invalid JSON.** Cannot parse results."
            exit 0
          fi

          # ── Normalise: snyk --all-projects outputs an array; single project  ─
          # outputs an object. Wrap object in array so downstream jq is uniform.
          NORMALISED=$(jq 'if type == "array" then . else [.] end' "${RESULTS_FILE}")

          # ── Count vulnerabilities by severity across ALL projects ────────────
          COUNT_CRITICAL=$(echo "${NORMALISED}" | jq '[.[].vulnerabilities[]? | select(.severity=="critical")] | length')
          COUNT_HIGH=$(echo     "${NORMALISED}" | jq '[.[].vulnerabilities[]? | select(.severity=="high")]     | length')
          COUNT_MEDIUM=$(echo   "${NORMALISED}" | jq '[.[].vulnerabilities[]? | select(.severity=="medium")]   | length')
          COUNT_LOW=$(echo      "${NORMALISED}" | jq '[.[].vulnerabilities[]? | select(.severity=="low")]      | length')
          COUNT_TOTAL=$(echo    "${NORMALISED}" | jq '[.[].vulnerabilities[]?] | length')

          # ── Overall pass/fail badge ──────────────────────────────────────────
          if [ "${COUNT_CRITICAL}" -gt 0 ] || [ "${COUNT_HIGH}" -gt 0 ]; then
            summary "### ❌ Status: FAILED — Critical or High vulnerabilities detected"
          else
            summary "### ✅ Status: PASSED — No Critical or High vulnerabilities found"
          fi
          summary ""

          # ── Severity summary table ───────────────────────────────────────────
          summary "### 📊 Vulnerability Summary"
          summary ""
          summary "| Severity     | Count |"
          summary "|:-------------|------:|"
          summary "| 🔴 Critical  | ${COUNT_CRITICAL} |"
          summary "| 🟠 High      | ${COUNT_HIGH} |"
          summary "| 🟡 Medium    | ${COUNT_MEDIUM} |"
          summary "| 🔵 Low       | ${COUNT_LOW} |"
          summary "| **Total**    | **${COUNT_TOTAL}** |"
          summary ""

          # ── Top-10 findings detail table (Critical → High → Medium → Low) ───
          summary "### 🔎 Top Findings (up to 10, sorted by severity)"
          summary ""
          summary "| # | Severity | Package | Installed Version | Fixed In | Title |"
          summary "|---|:---------|:--------|:------------------|:---------|:------|"

          echo "${NORMALISED}" | jq -r '
            [ .[].vulnerabilities[]?
              | {
                  sev:     .severity,
                  pkg:     (.packageName // "n/a"),
                  ver:     (.version    // "n/a"),
                  fix:     (if (.fixedIn | length) > 0 then (.fixedIn | join(", ")) else "No fix available" end),
                  title:   (.title      // "n/a")
                }
            ]
            | sort_by(
                if   .sev=="critical" then 0
                elif .sev=="high"     then 1
                elif .sev=="medium"   then 2
                else 3 end
              )
            | .[:10][]
            | [.sev, .pkg, .ver, .fix, .title]
            | @tsv
          ' | awk -F'\t' 'BEGIN{i=1} {
              sev=$1; pkg=$2; ver=$3; fix=$4; title=$5
              emoji="🔵"
              if (sev=="critical") emoji="🔴"
              else if (sev=="high") emoji="🟠"
              else if (sev=="medium") emoji="🟡"
              printf "| %d | %s %s | `%s` | `%s` | %s | %s |\n", i++, emoji, sev, pkg, ver, fix, title
          }' >> "${SUMMARY_FILE}"

          summary ""
          summary "---"
          summary "> 📦 **Full report:** Download the \`snyk-results\` artifact from the **Artifacts** section of this workflow run for the complete JSON output."
          summary "> 🔍 **Code Scanning:** Detailed findings are also available under **Security → Code scanning alerts** (SARIF upload)."
