skills:
  - name: secrets-scanner
    path: .tabnine/skills/secrets-scanner.md
    trigger: "Use the secrets-scanner skill to scan this repo"
    description: >
      Checks whether gitleaks is installed (installs via Homebrew on macOS or
      apt-get on Linux if missing), then scans the entire repository for
      committed secrets. Saves the full findings report to gitleaks-report.json
      and prints a redacted summary showing file, line, rule ID, and commit SHA
      — never the actual secret values. Provides remediation guidance for each
      finding.
    tags:
      - security
      - secrets
      - gitleaks
      - devSecOps
  - name: snyk-cli-provisioner
    path: .tabnine/skills/snyk-cli-provisioner.md
    trigger: "Run the snyk-cli-provisioner skill"
    description: >
      Checks whether the Snyk CLI is installed and authenticated. Installs via
      npm globally if missing. Guides through browser-based OAuth authentication
      if not authenticated. Runs snyk test --json --all-projects and saves the
      full dependency vulnerability report to snyk-report.json. Prints a
      severity summary (Critical/High/Medium/Low) — never logs SNYK_TOKEN or
      any credential value.
    tags:
      - security
      - snyk
      - dependencies
      - vulnerabilities
      - devSecOps
