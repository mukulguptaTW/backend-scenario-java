apiVersion: v1
kind: Service
metadata:
  name: petclinic-rest
  namespace: petclinic-prod
  labels:
    app.kubernetes.io/name: petclinic-rest
    env: production
spec:
  # NodePort exposes the service on every Kind node — accessible
  # from the host via the node's mapped port (configured in kind-config.yml).
  type: NodePort
  selector:
    app: petclinic-rest
  ports:
    - name: http
      protocol: TCP
      port: 9966
      targetPort: 9966
      nodePort: 30966
