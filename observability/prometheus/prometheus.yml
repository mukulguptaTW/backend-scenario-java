global:
  # How frequently Prometheus scrapes targets by default
  scrape_interval: 15s
  # How frequently Prometheus evaluates alerting rules
  evaluation_interval: 15s

scrape_configs:

  # ------------------------------------------------------------------
  # Scrape Prometheus itself
  # ------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: [ "localhost:9090" ]

  # ------------------------------------------------------------------
  # Scrape the PetClinic Spring Boot API
  #
  # host.docker.internal  →  resolves to the Mac host from inside Docker
  # 9966                  →  the port Spring Boot listens on
  # /petclinic/actuator/prometheus  →  the Micrometer scrape endpoint
  # ------------------------------------------------------------------
  - job_name: petclinic-rest
    metrics_path: /petclinic/actuator/prometheus
    static_configs:
      # host.docker.internal resolves only on Docker Desktop (Mac/Windows).
      # On Linux (GitHub Actions / KIND) use host-gateway or localhost.
      # docker-compose.yml already maps extra_hosts: host.docker.internal → host-gateway
      # so this target works for local docker-compose runs AND CI (KIND hostPort 9966).
      - targets: [ "host.docker.internal:9966" ]
    relabel_configs:
      - target_label: environment
        replacement: local
